<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive"
  >

  <title>LEBHE — Coming Soon</title>

  <style>
    :root {
      --paper: #eee3d5;
      --paper-light: #f5ede3;
      --ink: #0b0b09;
      --muted: rgba(11, 11, 9, 0.52);
      --line: rgba(11, 11, 9, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(360px, 42%) 1fr;
      background: var(--paper);
    }

    .panel {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: clamp(32px, 5vw, 76px);
      overflow: hidden;

      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(255, 255, 255, 0.48),
          transparent 36%
        ),
        radial-gradient(
          circle at 80% 82%,
          rgba(172, 127, 77, 0.08),
          transparent 34%
        ),
        var(--paper);
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;

      background-image:
        repeating-radial-gradient(
          circle at 0 0,
          rgba(0, 0, 0, 0.08) 0,
          rgba(0, 0, 0, 0.08) 0.55px,
          transparent 0.7px,
          transparent 4px
        );
    }

    .brand,
    .message,
    .footer {
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .logo {
      display: block;
      width: min(360px, 86%);
      height: auto;
    }

    .message {
      width: 100%;
      max-width: 470px;
      margin: auto 0;
      padding: clamp(58px, 9vh, 110px) 0;
    }

    .eyebrow {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.34em;
      text-transform: uppercase;
    }

    .rule {
      width: 54px;
      height: 1px;
      margin-bottom: 30px;
      background: var(--line);
    }

    h1 {
      max-width: 390px;
      margin: 0;

      font-size: clamp(2.6rem, 5vw, 5.7rem);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.065em;
    }

    .year {
      margin: 32px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.56em;
      text-indent: 0.56em;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .visual {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #a77a4e;
    }

    .visual img {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: block;
      object-fit: cover;
      object-position: center 48%;
      transform: scale(1.015);
    }

    .visual::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(32, 21, 11, 0.15),
          transparent 24%
        ),
        linear-gradient(
          180deg,
          rgba(20, 13, 7, 0.08),
          transparent 38%,
          rgba(20, 13, 7, 0.14)
        );
    }

    .visual-label {
      position: absolute;
      z-index: 2;
      right: clamp(24px, 3vw, 48px);
      bottom: clamp(24px, 3vw, 48px);

      color: rgba(255, 255, 255, 0.88);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    @media (max-width: 760px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: 56svh auto;
      }

      .visual {
        grid-row: 1;
        min-height: 56svh;
      }

      .visual img {
        min-height: 56svh;
        object-position: center 45%;
      }

      .panel {
        grid-row: 2;
        min-height: 44svh;
        padding: 30px 24px 28px;
      }

      .brand {
        justify-content: center;
      }

      .logo {
        width: min(330px, 88vw);
      }

      .message {
        margin: 0 auto;
        padding: 50px 0 54px;
        text-align: center;
      }

      .rule {
        margin-right: auto;
        margin-left: auto;
      }

      h1 {
        max-width: none;
        font-size: clamp(2.8rem, 15vw, 4.7rem);
      }

      .footer {
        justify-content: center;
      }

      .footer span:last-child {
        display: none;
      }

      .visual-label {
        right: 18px;
        bottom: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="panel">
      <header class="brand">
        <img
          class="logo"
          src="./logo.png"
          alt="LEBHE"
        >
      </header>

      <div class="message">
        <p class="eyebrow">A new chapter</p>
        <div class="rule" aria-hidden="true"></div>

        <h1>Coming<br>Soon</h1>
        <p class="year">2026</p>
      </div>

      <footer class="footer">
        <span>LEBHE</span>
        <span>Private preview</span>
      </footer>
    </section>

    <section class="visual" aria-label="LEBHE atmosphere">
      <img
        src="./hero.jpg"
        alt=""
      >

      <span class="visual-label">Arriving 2026</span>
    </section>
  </main>
</body>
</html>
