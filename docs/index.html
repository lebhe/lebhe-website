<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive"
  >

  <title>LEBHE — Coming Soon</title>

  <style>
    :root {
      --background: #ede1d2;
      --text: #0a0a0a;
      --muted: rgba(10, 10, 10, 0.55);
      --line: rgba(10, 10, 10, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255, 255, 255, 0.25),
          transparent 45%
        ),
        var(--background);

      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 48px 24px;
      text-align: center;
    }

    /*
      This frame crops the large empty areas
      from the original portrait JPG.
    */
    .logo-frame {
      width: min(760px, 92vw);
      aspect-ratio: 3.2 / 1;

      overflow: hidden;
      position: relative;
    }

    .logo {
      width: 100%;
      height: 100%;

      display: block;
      object-fit: cover;
      object-position: center 50%;

      mix-blend-mode: multiply;
    }

    .divider {
      width: 52px;
      height: 1px;

      margin: 46px auto 32px;
      background: var(--line);
    }

    .status {
      margin: 0;

      font-size: clamp(0.7rem, 1.3vw, 0.85rem);
      font-weight: 500;
      letter-spacing: 0.38em;
      text-indent: 0.38em;
      text-transform: uppercase;
    }

    .year {
      margin: 18px 0 0;

      color: var(--muted);
      font-size: clamp(0.75rem, 1.4vw, 0.9rem);
      font-weight: 400;
      letter-spacing: 0.55em;
      text-indent: 0.55em;
    }

    @media (max-width: 600px) {
      .page {
        padding: 32px 18px;
      }

      .logo-frame {
        width: 94vw;
        aspect-ratio: 2.45 / 1;
      }

      .divider {
        margin-top: 36px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="logo-frame">
      <img
        class="logo"
        src="./logo.jpg"
        alt="LEBHE"
      >
    </div>

    <div class="divider" aria-hidden="true"></div>

    <p class="status">Coming Soon</p>
    <p class="year">2026</p>
  </main>
</body>
</html>
