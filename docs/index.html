<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      overflow: hidden;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: white;
      text-align: center;

      background:
        radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 35%),
        radial-gradient(circle at bottom, rgba(255,255,255,0.04), transparent 30%),
        linear-gradient(180deg, #050505 0%, #0b0b0b 45%, #050505 100%);
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    .logo {
      display: block;
      width: 140px;
      max-width: 45vw;
      height: auto;
      margin: 0 auto 40px;
      object-fit: contain;
    }

    .line {
      width: 80px;
      height: 1px;
      background: rgba(255,255,255,0.25);
      margin: 0 auto 30px;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 0.95;
      text-shadow: 0 0 24px rgba(255,255,255,0.08);
    }

    .subtitle {
      margin-top: 18px;
      color: rgba(255,255,255,0.65);
      font-size: 0.95rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .year {
      margin-top: 28px;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.55em;
      text-transform: uppercase;
    }

    .small-text {
      margin-top: 40px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .logo {
        width: 110px;
        margin-bottom: 30px;
      }

      .subtitle {
        font-size: 0.8rem;
        letter-spacing: 0.25em;
      }

      .year {
        font-size: 1rem;
        letter-spacing: 0.4em;
      }

      .small-text {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <img class="logo" src="./logo.jpg" alt="Logo">

    <div class="line"></div>

    <h1>Coming Soon</h1>
    <p class="subtitle">A new chapter is arriving</p>
    <p class="year">2026</p>

    <p class="small-text">LEBHE</p>
  </main>
</body>
</html>
